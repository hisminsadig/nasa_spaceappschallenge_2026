<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a2d">
  <title>WallkiHealth | Video Presentation</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: clamp(18px, 4vw, 52px);
      display: grid;
      place-items: center;
      color: #fff;
      background: #101a2d;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    main { width: min(100%, 1440px); }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: clamp(22px, 3vw, 34px); }
    .back {
      display: inline-block;
      padding: 11px 17px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 9px;
      color: #fff;
      text-decoration: none;
      white-space: nowrap;
      transition: background .2s;
    }
    .back:hover { background: rgba(255,255,255,.14); }
    .video-frame {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 14px;
      background: #000;
      box-shadow: 0 18px 55px rgba(0,0,0,.4);
    }
    @media (max-width: 520px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .video-frame { border-radius: 9px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="topbar">
      <h1>WallkiHealth Video Presentation</h1>
      <a class="back" href="index.html">Back to project page</a>
    </div>
    <iframe class="video-frame" src="https://drive.google.com/file/d/1DQQT1LCVMpbh5-lRPrQkfwbhI1Xv2mW1/preview" title="WallkiHealth video presentation" allow="autoplay; fullscreen" allowfullscreen></iframe>
  </main>
</body>
</html>
